[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hr-email-finder"
version = "0.1.0"
description = "Find a company's public HR / recruiting contact email, with evidence."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.11,<2",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "dnspython>=2.6",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hr-email-finder = "hr_email_finder.cli:main"

[tool.setuptools.packages.find]
include = ["hr_email_finder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
